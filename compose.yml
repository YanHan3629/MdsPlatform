name: multimodal-dataspace

# Canonical project entry for data space, search, QA and model inference.
include:
  - mdsPlatform/services/backend/docker-compose.yml

services:
  evidence-worker:
    image: sirius-mm-index-builder:latest
    command: ["python", "/evidence-worker/worker.py"]
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    pids_limit: 64
    read_only: true
    environment:
      PYTHONPATH: /app
      MM_INTERNAL_TOKEN: ${MM_INTERNAL_TOKEN:?MM_INTERNAL_TOKEN must be set in the root .env file}
      MDS_EVIDENCE_CPU_LOCK_DIR: /var/lock/mds-evidence
      EVIDENCE_CACHE_DIR: /cache
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_THREAD_LIMIT: "1"
    volumes:
      - ./mdsPlatform/services/evidence-worker:/evidence-worker:ro
      - evidence_region_cache:/cache
      - evidence_cpu_queue:/var/lock/mds-evidence
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18083/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  local-receiver:
    image: sirius-backend:latest
    entrypoint: ["java", "-Dloader.main=com.fwdrobo.sirius.dataspace.ReceiverMain", "-cp", "/app/sirius-backend.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    restart: unless-stopped
    environment:
      DS_RECEIVER_TOKEN: ${MM_INTERNAL_TOKEN:?MM_INTERNAL_TOKEN must be set in the root .env file}
    volumes:
      - ds_receiver_data:/receiver-data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:18082/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
  business-worker:
    image: sirius-mm-index-builder:latest
    command: ["python", "/business-worker/worker.py"]
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://sirius:8888
      MM_INTERNAL_TOKEN: ${MM_INTERNAL_TOKEN:?MM_INTERNAL_TOKEN must be set in the root .env file}
      PYTHONPATH: /app
    volumes:
      - ./mdsPlatform/services/business-worker:/business-worker:ro
    depends_on:
      sirius:
        condition: service_started
  vllm:
    restart: unless-stopped
    # 支持 Qwen3.5 的 vLLM 官方镜像；如需其他 tag 可用环境变量 VLLM_IMAGE 覆盖
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.17.0}
    command:
      - --model
      - /models/Qwen3.5-0.8B
      - --served-model-name
      - Qwen/Qwen3.5-0.8B
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "2048"
      - --gpu-memory-utilization
      - "0.78"
      - --max-num-seqs
      - "2"
      - --limit-mm-per-prompt
      - '{"image": 2}'
      - --enforce-eager
      - --skip-mm-profiling
      # /tokenize must not leave API-side multimodal cache references that the
      # generation engine has never received (vLLM 0.17.0). Keep real image
      # token accounting and both image slots; disable only this processor cache.
      - --mm-processor-cache-gb
      - "0"
    volumes:
      - ./mdsPlatform/services/qa-service/Qwen3.5-0.8B:/models/Qwen3.5-0.8B:ro
    ports:
      - "8000:8000"
    ipc: host
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  qa-service:
    build: ./mdsPlatform/services/qa-service
    image: sirius-mm-qa-service:latest
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "18081"]
    restart: unless-stopped
    environment:
      VLLM_BASE_URL: http://vllm:8000
      MODEL_NAME: Qwen/Qwen3.5-0.8B
      LLM_BACKEND: vllm
      DEFAULT_MAX_TOKENS: "512"
      BACKEND_BASE_URL: http://sirius:8888
      SEARCH_SERVICE_BASE_URL: http://search-service:18080
      MM_INTERNAL_TOKEN: ${MM_INTERNAL_TOKEN:?MM_INTERNAL_TOKEN must be set in the root .env file}
      BACKEND_SEARCH_PATH: /api/data-space/qa/search
      QA_EVIDENCE_TRACE_DIR: /var/log/qa-evidence
    volumes:
      - ${QA_EVIDENCE_TRACE_HOST_DIR:-./data/qa-evidence-traces}:/var/log/qa-evidence
    ports:
      - "18081:18081"
    depends_on:
      sirius:
        condition: service_started
      search-service:
        condition: service_healthy
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evidence_region_cache:
  evidence_cpu_queue:
    name: sirius-evidence-cpu-queue
  ds_receiver_data:
